<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="./css/styles.css">

</head>
<body>

    <nav class="navbar navbar-expand-lg mi-nav">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-book"></i>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="catalogo.html">Catalogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>                    
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-5" id="detalle-libro"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="./js/data.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get("id"));
        const libro = libros[id];
        const contenedor = document.getElementById("detalle-libro");

        if (libro) {
            contenedor.innerHTML = `
                <div class="row">
                    <div class="col-md-4">
                        <img src="${libro.portada}" class="img-fluid" alt="Portada del libro">
                    </div>
                    <div class="col-md-8">
                        <h1>${libro.titulo}</h1>
                        <h5 class="text-muted">${libro.autor}</h5>
                        <p class="mt-3">${libro.descripcion}</p>
                        <p><strong>Precio:</strong> ${libro.precio}</p>
                        <button class="btn btn-success me-2">Comprar</button>
                        <a href="catalogo.html" class="btn btn-secondary">Volver al catálogo</a>
                    </div>
                </div>
            `;
        } else {
            contenedor.innerHTML = `<p class="text-danger">Libro no encontrado.</p>`;
        }
    </script>

</body>
</html>
