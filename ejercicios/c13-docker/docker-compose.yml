services:
  api:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - backend/.env
    depends_on:
      - db

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: